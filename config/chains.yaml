# api_base_url points at the PARTNER GATEWAY (partners.cow.fi), not the public
# api.cow.fi. The X-API-Key we send is ONLY honoured by the gateway; on the public
# host it is silently ignored and every request falls under the public per-IP rate
# rule (~100 req/min), which CloudFront answers with a 403 "Request blocked" page
# and a 30-60 min cooldown. That is why the indexer tripped the edge at ~78 req/min
# for months while holding a valid key -- the key was never being applied.
#
# Verified 2026-09-16 from the cluster, same pod and minute, while api.cow.fi was
# mid-cooldown:
#   api.cow.fi      + key -> 403     api.cow.fi      no key -> 403
#   partners.cow.fi + key -> 200     partners.cow.fi no key -> 401
# The 401 is the proof the gateway actually validates the key. All 11 networks
# answer 200 there, as do the real workload endpoints (POST /api/v1/orders/by_uids,
# /api/v2/solver_competition/latest, /api/v2/trades).
#
# Keep the browser TLS impersonation in sources/http.py regardless: the edge also
# screens on JA3 handshake fingerprint, which is a separate gate from the key.
chains:
  - key: mainnet
    chain_id: 1
    environment: production
    api_base_url: https://partners.cow.fi/mainnet
    rpc_url_env: COW_RPC_URL_MAINNET
    deployment_file: deployments/mainnet.json
    finality_blocks: 20
    enabled: true
